name: Host hero jpeg

# hero-mesa-posta.jpg is the versioned asset in this repo.
# This workflow only checks that file. It does not download it
# and it does not publish any branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify versioned hero asset
        run: |
          echo "9318538c47fd02a6d6b172eed0f7f9c523c3f3296e3321927854ea2c69582107  hero-mesa-posta.jpg" | sha256sum -c -
          file hero-mesa-posta.jpg | grep -q 'JPEG image data'
